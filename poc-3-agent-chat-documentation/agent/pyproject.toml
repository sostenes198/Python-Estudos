[project]
name = "agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Sóstenes Gonçalves de Souza",email = "sostenes.souza@govoll.com"}
]
requires-python = "3.14.3"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn[standard] (>=0.50.2,<0.51.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "slack-sdk (>=3.43.0,<4.0.0)",
    "anthropic (>=0.116.0,<0.117.0)",
    "langchain (>=1.3.11,<2.0.0)",
    "langchain-anthropic (>=1.4.8,<2.0.0)",
    "langchain-openai (>=1.3.3,<2.0.0)",
    "langchain-mongodb (>=0.11.0,<0.12.0)",
    "langgraph (>=1.2.8,<2.0.0)",
    "langgraph-checkpoint-mongodb (>=0.4.0,<0.5.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "pymongo (>=4.12,<4.17)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
